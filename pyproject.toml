[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commytho"
dynamic = ["version"]
description = "Planifie de petits commits bridés vers un dépôt qui vous appartient, depuis votre propre machine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Guillaume YVES" }]
keywords = ["git", "github", "automatisation", "scheduler", "cron", "commits"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]
dependencies = ["keyring>=24.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
commytho = "commytho.cli:main"

[project.urls]
Homepage = "https://github.com/GuillaumeYves/commytho"
Source = "https://github.com/GuillaumeYves/commytho"
Issues = "https://github.com/GuillaumeYves/commytho/issues"
Changelog = "https://github.com/GuillaumeYves/commytho/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/commytho/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/commytho"]

[tool.hatch.build.targets.sdist]
include = ["src/commytho", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
