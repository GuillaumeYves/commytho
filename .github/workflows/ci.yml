name: CI

# On teste sur les trois systèmes visés par l'outil. Un planificateur qui marche
# sous Linux et casse sous Windows ne sert à rien, autant le voir tout de suite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format
        run: python -m ruff format --check .

  test:
    name: Tests ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q

  smoke:
    name: Installation réelle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construction du paquet
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Installation depuis la roue construite
        shell: bash
        run: python -m pip install dist/*.whl
      # On vérifie que le point d'entrée existe vraiment et répond, ce qu'un
      # test unitaire ne prouve pas.
      - name: La commande répond
        run: |
          commytho --version
          commytho status
